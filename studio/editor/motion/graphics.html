<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!--
  Brand motion graphics. Colours/fonts come from studio/brand.py (brand.json) via window.__brand().
  Render contract: everything is a pure function of time. Animations are Web Animations with
  closed-form spring easings (CSS linear()), paused and seeked by window.__seek(ms). No timers.
-->
<style>
  @font-face { font-family: "Space Grotesk"; src: url("../../../assets/fonts/SpaceGrotesk-static-700.ttf"); font-weight: 700; }
  @font-face { font-family: "Space Grotesk"; src: url("../../../assets/fonts/SpaceGrotesk-static-600.ttf"); font-weight: 600; }
  @font-face { font-family: "Inter"; src: url("../../../assets/fonts/Inter-Variable.ttf"); font-weight: 100 900; }
  @font-face { font-family: "Kode Mono"; src: url("../../../assets/fonts/KodeMono-Variable.ttf"); font-weight: 400 700; }
  :root {
    --ink: #0f172a; --ink-deep: #061616; --muted: #475569;
    --accent: #147d78; --accent-soft: #31a5a0; --accent-glow: #56c7c1; --tint: #e8f5f4;
    --success: #1fb573; --rose: #e11d48; --border: #e8eaf2;
  }
  html, body { margin: 0; width: 1080px; height: 1920px; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; width: 1080px; display: flex; align-items: flex-start; justify-content: center; padding-top: 6px; box-sizing: border-box; }
  .card {
    position: relative; display: flex; align-items: center; gap: 40px; padding: 44px 56px; border-radius: 44px; min-width: 760px;
    background: rgba(255, 255, 255, 0.93); border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 30px 70px rgba(6, 22, 22, 0.32), 0 2px 0 rgba(255, 255, 255, 0.6) inset;
    transform-origin: 50% 60%; will-change: auto;
  }
  .stack { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .center { align-items: center; text-align: center; }
  .eyebrow { display: flex; align-items: center; gap: 14px; font: 600 36px/1 "Kode Mono"; letter-spacing: .1em;
             text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .eyebrow::before { content: ""; width: 15px; height: 15px; border-radius: 50%; background: var(--dot, var(--success)); }
  .title { font: 700 100px/1.0 "Space Grotesk"; letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; }
  .title em, .slam em { font-style: normal; color: var(--accent); }
  .sub { font: 500 44px/1.2 "Inter"; color: var(--muted); white-space: nowrap; }
  .mask { display: block; overflow: hidden; padding: .06em 0 .24em; margin: -.06em 0 -.24em; }
  .mask > span { display: inline-block; }
  .tile { width: 260px; height: 260px; flex: none; border-radius: 40px; background: var(--ink-deep); display: grid; place-items: center;
          box-shadow: inset 0 0 0 2px rgba(86, 199, 193, 0.18), inset 0 10px 30px rgba(0, 0, 0, .55); }
  .tile svg { width: 72%; height: 72%; overflow: visible; }
  .bubble { width: 230px; height: 230px; flex: none; border-radius: 50%; background: var(--tint); color: var(--accent); display: grid; place-items: center; }
  .bubble svg { width: 54%; height: 54%; }
  .cluster { display: flex; gap: 34px; padding: 40px 48px; border-radius: 40px; background: var(--ink-deep); box-shadow: inset 0 10px 30px rgba(0,0,0,.55); }
  .cluster .ic { width: 190px; height: 190px; }
  .cluster svg { width: 100%; height: 100%; overflow: visible; }
  .housing { display: flex; gap: 36px; padding: 34px 44px; border-radius: 100px; background: var(--ink-deep); box-shadow: inset 0 10px 30px rgba(0,0,0,.6); }
  .lamp { width: 160px; height: 160px; border-radius: 50%; background: #18201f; box-shadow: inset 0 6px 14px rgba(0,0,0,.7); }
  .num { font: 700 230px/0.9 "Space Grotesk"; letter-spacing: -0.06em; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .num.before { color: #94a3b8; font-size: 160px; position: relative; }
  .strike { position: absolute; left: -6px; right: -6px; top: 52%; height: 10px; border-radius: 6px; background: var(--rose); transform-origin: 0 50%; }
  .arrow { font: 700 130px/1 "Space Grotesk"; color: var(--accent-soft); }
  .row { display: flex; align-items: center; gap: 30px; }
  .item { display: flex; align-items: center; gap: 22px; }
  .check { width: 90px; height: 90px; flex: none; border-radius: 24px; background: var(--tint); color: var(--accent); display: grid; place-items: center; }
  .check svg { width: 58%; height: 58%; }
  .step { width: 104px; height: 104px; flex: none; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
          font: 700 46px/1 "Space Grotesk"; letter-spacing: -0.03em; box-shadow: 0 10px 26px rgba(20,125,120,.35); }
  .item .title { font-size: 80px; }
  .slam { font: 700 210px/0.92 "Space Grotesk"; letter-spacing: -0.06em; color: var(--ink); text-align: center;
          padding: 40px 70px 50px; border-radius: 48px; background: rgba(255, 255, 255, 0.95);
          box-shadow: 0 30px 70px rgba(6, 22, 22, 0.35); }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---------------------------------------------------------------- springs
// Closed-form damped spring 0→1, sampled into a CSS linear() easing so Web Animations stay seekable.
function springValue(t, k, d) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z * z); return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t)); }
  return 1 - Math.exp(-w0 * t) * (1 + w0 * t);
}
const SPRINGS = { snappy: [320, 28], ui: [210, 24], heavy: [140, 24], playful: [260, 16] };
const _ease = {};
function spring(name = "ui") {
  if (_ease[name]) return _ease[name];
  const [k, d] = SPRINGS[name];
  let T = 0.05; while (T < 3 && Math.abs(1 - springValue(T, k, d)) > 0.002) T += 0.01; T = Math.max(T, 0.25);
  const pts = []; for (let i = 0; i <= 48; i++) pts.push(springValue(i / 48 * T, k, d).toFixed(4));
  pts[48] = "1";
  return (_ease[name] = { easing: `linear(${pts.join(",")})`, ms: Math.round(T * 1000) });
}
const play = (el, kf, start, s = "ui") => { const sp = spring(s); return el.animate(kf, { delay: start, duration: sp.ms, fill: "both", easing: sp.easing }); };
const tween = (el, kf, start, dur, easing = "cubic-bezier(.16,1,.3,1)") => el.animate(kf, { delay: start, duration: dur, fill: "both", easing });

// ---------------------------------------------------------------- content colours (the subject's colours, not brand chrome)
const LIGHT = { red: "#ff3b30", amber: "#ffb000", green: "#22d36b", blue: "#3b8cff", white: "#f1f5f9", teal: "#56c7c1" };
const L = (c) => LIGHT[c] || LIGHT.teal;

const DASH = {
  oil: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><path d="M14 46h16l6-8h18l26-10 6 4-24 26H34l-6-6H14z" fill="currentColor" fill-opacity=".18"/><path d="M14 46v10"/><path d="M40 30h12M46 30v8"/><path d="M86 52c0 0-5 7-5 10a5 5 0 0 0 10 0c0-3-5-10-5-10z" fill="currentColor"/></svg>`,
  temp: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M50 14v42"/><path d="M50 22h12M50 34h12M50 46h12"/><circle cx="50" cy="64" r="9" fill="currentColor"/><path d="M18 80c6-5 10-5 16 0s10 5 16 0 10-5 16 0 10 5 16 0"/></svg>`,
  battery: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"><rect x="14" y="30" width="72" height="46" rx="5" fill="currentColor" fill-opacity=".18"/><path d="M26 30v-8h12v8M62 30v-8h12v8"/><path d="M26 53h14M33 46v14M60 53h14" stroke-linecap="round"/></svg>`,
  check_engine: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round"><path d="M30 36h30l6 8h10v-6h8v34h-8v-6h-8l-8 10H34l-6-8h-8v8h-8V44h8v8h8z" fill="currentColor" fill-opacity=".18"/><path d="M38 36v-8h16v8M40 28h12"/></svg>`,
  tire_pressure: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M26 78c-8-8-12-18-12-30 0-20 16-32 36-32s36 12 36 32c0 12-4 22-12 30"/><path d="M20 84h8M72 84h8M36 84h8M56 84h8"/><path d="M50 30v24"/><circle cx="50" cy="66" r="4" fill="currentColor"/></svg>`,
  abs: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="50" r="26"/><path d="M14 30c-6 12-6 28 0 40M86 30c6 12 6 28 0 40"/><text x="50" y="59" font-family="Space Grotesk" font-weight="700" font-size="24" fill="currentColor" stroke="none" text-anchor="middle">ABS</text></svg>`,
  traction: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 46l8-16h36l8 16v14H24z" fill="currentColor" fill-opacity=".18"/><circle cx="34" cy="62" r="5" fill="currentColor"/><circle cx="66" cy="62" r="5" fill="currentColor"/><path d="M30 76c4 6 8-6 12 0M48 76c4 6 8-6 12 0M66 76c4 6 8-6 12 0"/></svg>`,
  brake: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="50" r="26"/><path d="M14 30c-6 12-6 28 0 40M86 30c6 12 6 28 0 40"/><path d="M50 36v18"/><circle cx="50" cy="64" r="4" fill="currentColor"/></svg>`,
  high_beam: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M44 26c22 0 34 10 34 24s-12 24-34 24z" fill="currentColor" fill-opacity=".18"/><path d="M14 34h20M14 46h20M14 58h20M14 70h20"/></svg>`,
  cruise: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><path d="M18 66a32 32 0 1 1 64 0"/><path d="M50 62l16-20"/><circle cx="50" cy="64" r="5" fill="currentColor"/><path d="M24 50l6 3M76 50l-6 3M50 26v7"/></svg>`,
  seatbelt: `<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"><circle cx="50" cy="20" r="8" fill="currentColor"/><path d="M36 36h28l4 30H32z" fill="currentColor" fill-opacity=".18"/><path d="M34 36l30 30M40 84l4-18M60 84l-4-18"/></svg>`,
};
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
let LUCIDE = {};
const DEFAULT_ICONS = { red: "oil", amber: "check_engine", green: "high_beam", blue: "high_beam" };

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// *word* → teal highlight (one accent colour)
function rich(s) { return esc(s).replace(/\*([^*]+)\*/g, "<em>$1</em>"); }
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; }
function masked(cls, html) { return `<span class="mask ${cls}"><span>${html}</span></span>`; }
function eyebrow(text, dot) { return text ? masked("", `<span class="eyebrow" style="--dot:${dot || "var(--success)"}">${esc(text)}</span>`) : ""; }

// ---------------------------------------------------------------- shared motion
function cardIn(card, total) {
  play(card, [{ transform: "translateY(70px) scale(.9)", opacity: 0 }, { transform: "translateY(0) scale(1)", opacity: 1 }], 0, "ui");
  tween(card, [{ transform: "translateY(0) scale(1)", opacity: 1 }, { transform: "translateY(-34px) scale(.96)", opacity: 0 }], total - 280, 280, "cubic-bezier(.5,0,.75,0)");
}
function riseText(root, start = 50, gap = 60) {
  [...root.querySelectorAll(".mask > span")].forEach((s, k) =>
    play(s, [{ transform: "translateY(105%)" }, { transform: "translateY(0)" }], start + k * gap, "snappy"));
}
function lightUp(svgHost, color, start) {
  svgHost.style.color = L(color);
  tween(svgHost, [{ opacity: .12, filter: "none" }, { opacity: 1, filter: `drop-shadow(0 0 14px ${L(color)}) drop-shadow(0 0 30px ${L(color)}99)` }], start, 90, "linear");
  tween(svgHost, [{ opacity: 1 }, { opacity: .35 }, { opacity: 1 }], start + 90, 160, "linear");
}

// ---------------------------------------------------------------- graphic types
const T = {
  hook_title(g, total) {
    const card = el(`<div class="card"><div class="stack">${eyebrow(g.eyebrow)}${masked("", `<span class="title" style="font-size:104px;white-space:normal;display:block;max-width:900px">${rich(g.text || g.label)}</span>`)}</div></div>`);
    cardIn(card, total); riseText(card, 140, 90); return card;
  },
  dash_light(g, total) {
    const icon = DASH[g.icon] || DASH[DEFAULT_ICONS[g.color]] || DASH.check_engine;
    const card = el(`<div class="card"><div class="tile"><div class="ic">${icon}</div></div><div class="stack">
      ${eyebrow(g.eyebrow || `${g.color || ""} light`, L(g.color))}${masked("", `<span class="title">${rich(g.label)}</span>`)}
      ${g.sub ? masked("", `<span class="sub">${esc(g.sub)}</span>`) : ""}</div></div>`);
    const ic = card.querySelector(".tile .ic"); ic.style.width = "72%"; ic.style.height = "72%";
    lightUp(ic, g.color, 260);
    if (g.color === "red") tween(ic, [{ opacity: 1 }, { opacity: .55 }, { opacity: 1 }], 1000, 700, "ease-in-out");
    cardIn(card, total); riseText(card, 200); return card;
  },
  bulb_check(g, total) {
    const icons = (g.items && g.items.length >= 3 ? g.items : ["check_engine", "oil", "battery", "temp"]).filter(n => DASH[n]).slice(0, 4);
    const tint = ["amber", "red", "red", "red", "amber", "amber"];
    const card = el(`<div class="card" style="flex-direction:column;gap:26px"><div class="cluster">${icons.map(n => `<div class="ic">${DASH[n]}</div>`).join("")}</div>
      <div class="stack center">${eyebrow(g.eyebrow || "key on")}${masked("", `<span class="title" style="font-size:84px">${rich(g.label || "Every light should *come on*")}</span>`)}</div></div>`);
    const ics = [...card.querySelectorAll(".cluster .ic")];
    const off0 = Math.max(1100, total * .5), step = Math.min(200, (total - off0 - 450) / Math.max(1, ics.length));
    ics.forEach((e, k) => {
      e.style.opacity = .12; lightUp(e, tint[k % tint.length], 300 + k * 40);
      if (icons[k] !== g.icon) tween(e, [{ opacity: 1 }, { opacity: .1, filter: "none" }], off0 + k * step, 120, "linear");
    });
    cardIn(card, total); riseText(card, 220); return card;
  },
  traffic_light(g, total) {
    const lamps = ["red", "amber", "green"];
    const labels = (g.items && g.items.length === 3 ? g.items : ["*Stop*", "Slow *down*", "*Go*"]);
    const card = el(`<div class="card" style="flex-direction:column;gap:26px">${eyebrow(g.eyebrow || "Dash color code")}<div class="housing">${lamps.map(c => `<div class="lamp"></div>`).join("")}</div>
      <div style="position:relative;height:104px;width:900px">${lamps.map((c, k) =>
        `<div class="lbl" style="position:absolute;inset:0;display:flex;justify-content:center">${masked("", `<span class="title" style="font-size:92px">${rich(labels[k] || "")}</span>`)}</div>`).join("")}</div></div>`);
    const lampEls = [...card.querySelectorAll(".lamp")], lbls = [...card.querySelectorAll(".lbl")];
    const seq = g.active && g.active !== "sequence" && lamps.includes(g.active) ? [lamps.indexOf(g.active)] : [0, 1, 2];
    const span = (total - 650) / seq.length;
    lbls.forEach(l => (l.style.opacity = 0));
    seq.forEach((k, j) => {
      const s = 300 + j * span + (j ? 60 : 0), last = j === seq.length - 1;
      tween(lampEls[k], [{ background: "#18201f", boxShadow: "inset 0 6px 14px rgba(0,0,0,.7)" },
                          { background: L(lamps[k]), boxShadow: `0 0 34px ${L(lamps[k])}, 0 0 80px ${L(lamps[k])}99` }], s, 110, "linear");
      if (!last) tween(lampEls[k], [{ opacity: 1 }, { opacity: .28 }], s + span - 80, 120, "linear");
      lbls[k].style.opacity = 1;
      play(lbls[k].querySelector(".mask > span"), [{ transform: "translateY(105%)" }, { transform: "translateY(0)" }], s, "snappy");
      if (!last) tween(lbls[k].querySelector(".mask > span"), [{ transform: "translateY(0)" }, { transform: "translateY(-140%)" }], s + span - 220, 150, "cubic-bezier(.5,0,.75,0)");
    });
    const eb = card.querySelector(":scope > .mask > span"); if (eb) play(eb, [{ transform: "translateY(105%)" }, { transform: "none" }], 60, "snappy");
    cardIn(card, total); return card;
  },
  stat(g, total) {
    const card = el(`<div class="card"><div class="stack">${eyebrow(g.eyebrow || g.label)}<div class="num" data-count="${esc(g.value)}">${esc(g.value)}</div>
      ${g.sub ? masked("", `<span class="sub">${esc(g.sub)}</span>`) : ""}</div></div>`);
    cardIn(card, total); riseText(card, 160); return card;
  },
  before_after(g, total) {
    const card = el(`<div class="card"><div class="stack center">${eyebrow(g.eyebrow || g.label)}
      <div class="row"><div class="num before">${esc(g.before)}<div class="strike"></div></div><div class="arrow">→</div><div class="num">${esc(g.value)}</div></div>
      ${g.sub ? masked("", `<span class="sub">${esc(g.sub)}</span>`) : ""}</div></div>`);
    const [b, a, v] = card.querySelectorAll(".row > *");
    play(b, [{ transform: "translateY(30px)", opacity: 0 }, { transform: "none", opacity: 1 }], 150, "snappy");
    play(card.querySelector(".strike"), [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], 650, "snappy");
    play(a, [{ transform: "translateX(-30px)", opacity: 0 }, { transform: "none", opacity: 1 }], 750, "snappy");
    play(v, [{ transform: "scale(.5)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], 880, "playful");
    cardIn(card, total); riseText(card, 140); return card;
  },
  icon(g, total) {
    const svg = DASH[g.icon] || LUCIDE[g.icon] || LUCIDE["circle-check"] || CHECK;
    const card = el(`<div class="card"><div class="bubble">${svg}</div><div class="stack">${eyebrow(g.eyebrow)}
      ${masked("", `<span class="title">${rich(g.label)}</span>`)}${g.sub ? masked("", `<span class="sub">${esc(g.sub)}</span>`) : ""}</div></div>`);
    play(card.querySelector(".bubble svg"), [{ transform: "scale(.3) rotate(-25deg)" }, { transform: "scale(1) rotate(0)" }], 180, "playful");
    cardIn(card, total); riseText(card, 220); return card;
  },
  checklist(g, total) {
    const items = (g.items || []).slice(0, 4);
    const card = el(`<div class="card"><div class="stack" style="gap:20px">${eyebrow(g.eyebrow || g.label)}
      ${items.map(t => `<div class="item"><div class="check">${CHECK}</div>${masked("", `<span class="title">${rich(t)}</span>`)}</div>`).join("")}</div></div>`);
    const rows = [...card.querySelectorAll(".item")]; const gap = Math.min(520, (total - 1000) / Math.max(1, rows.length));
    rows.forEach((r, k) => {
      play(r.querySelector(".check"), [{ transform: "scale(0)" }, { transform: "scale(1)" }], 140 + k * gap, "playful");
      play(r.querySelector(".mask > span"), [{ transform: "translateY(105%)" }, { transform: "none" }], 190 + k * gap, "snappy");
    });
    const eb = card.querySelector(".stack > .mask > span"); if (eb) play(eb, [{ transform: "translateY(105%)" }, { transform: "none" }], 40, "snappy");
    cardIn(card, total); return card;
  },
  steps(g, total) {
    const items = (g.items || []).slice(0, 4);
    const card = el(`<div class="card"><div class="stack" style="gap:20px">${eyebrow(g.eyebrow || g.label)}
      ${items.map((t, k) => `<div class="item"><div class="step">${String(k + 1).padStart(2, "0")}</div>${masked("", `<span class="title">${rich(t)}</span>`)}</div>`).join("")}</div></div>`);
    const rows = [...card.querySelectorAll(".item")]; const gap = Math.min(520, (total - 1000) / Math.max(1, rows.length));
    rows.forEach((r, k) => {
      play(r.querySelector(".step"), [{ transform: "scale(0)" }, { transform: "scale(1)" }], 140 + k * gap, "playful");
      play(r.querySelector(".mask > span"), [{ transform: "translateY(105%)" }, { transform: "none" }], 190 + k * gap, "snappy");
    });
    const eb = card.querySelector(".stack > .mask > span"); if (eb) play(eb, [{ transform: "translateY(105%)" }, { transform: "none" }], 40, "snappy");
    cardIn(card, total); return card;
  },
  word_slam(g, total) {
    const node = el(`<div class="slam">${rich(g.text || g.label)}</div>`);
    play(node, [{ transform: "scale(1.9)", opacity: 0 }, { transform: "scale(1)", opacity: 1 }], 0, "heavy");
    tween(node, [{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.94)" }], total - 240, 240, "cubic-bezier(.5,0,.75,0)");
    return node;
  },
};

// Brand tokens injected by the renderer (falls back to the defaults in :root).
window.__brand = (b) => {
  const r = document.documentElement.style, c = (b && b.colors) || {};
  const map = { accent: "--accent", accent_soft: "--accent-soft", accent_glow: "--accent-glow", tint: "--tint",
                ink: "--ink", ink_deep: "--ink-deep", success: "--success", danger: "--rose" };
  for (const [k, v] of Object.entries(map)) if (c[k]) r.setProperty(v, c[k]);
};

window.__mount = (g, total, band) => {
  document.getAnimations().forEach(a => a.cancel());
  const stage = document.getElementById("stage");
  stage.innerHTML = ""; stage.style.top = band.top + "px"; stage.style.height = band.height + "px";
  const node = (T[g.type] || T.icon)(g, total);
  const wrap = document.createElement("div"); wrap.style.transformOrigin = "50% 0"; wrap.appendChild(node); stage.appendChild(wrap);
  // layout size (ignores the in-flight entrance transform)
  const w = node.offsetWidth, h = node.offsetHeight;
  const s = Math.min(1, 1020 / w, (band.height - 24) / h);
  wrap.style.transform = `scale(${s})`;
  document.getAnimations().forEach(a => a.pause());
  return { w: w * s, h: h * s, scale: s };
};

window.__seek = (ms) => {
  for (const a of document.getAnimations()) a.currentTime = ms;
  for (const n of document.querySelectorAll("[data-count]")) {
    const m = String(n.dataset.count).match(/^([^\d]*)([\d,.]+)(.*)$/);
    if (!m) continue;
    const target = parseFloat(m[2].replace(/,/g, "")), dec = (m[2].split(".")[1] || "").length;
    const p = springValue(Math.max(0, ms - 200) / 1000, 140, 24);
    const v = target * Math.min(1, p);
    n.textContent = m[1] + (dec ? v.toFixed(dec) : Math.round(v).toLocaleString("en-US")) + m[3];
  }
};
</script>
</body>
</html>
